name: Publish Frontend Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/furkancodes/skrap-ui

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        env:
          COOLIFY_FRONTEND_WEBHOOK: ${{ secrets.COOLIFY_FRONTEND_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_FRONTEND_WEBHOOK" ]; then
            echo "COOLIFY_FRONTEND_WEBHOOK is not set; image was published but Coolify deploy was not triggered."
            exit 0
          fi

          if [ -n "$COOLIFY_TOKEN" ]; then
            curl --fail --request GET "$COOLIFY_FRONTEND_WEBHOOK" \
              --header "Authorization: Bearer $COOLIFY_TOKEN"
          else
            curl --fail --request GET "$COOLIFY_FRONTEND_WEBHOOK"
          fi
